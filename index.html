<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#170B2E;
  --purple-deep:#2F1354;
  --purple-mid:#4B1E86;
  --purple-line: rgba(255,255,255,0.14);
  --magenta:#E23E9C;
  --magenta-deep:#B9227C;
  --energia-red:#E5192B;
  --paper:#FBF8FD;
  --paper-line:#E7DEF0;
  --ink-soft:#5A5170;
  --white:#FFFFFF;
  --win:#1E8A5B;
  --draw:#B8862B;
  --loss:#C23B4B;
  --radius-card: 4px;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
a{color:inherit;}

/* focus visibility */
:focus-visible{outline:3px solid var(--magenta); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- Header ---------- */
.site-header{
  background: linear-gradient(155deg, var(--ink) 0%, var(--purple-deep) 55%, var(--purple-mid) 100%);
  color:var(--white);
  padding: 22px clamp(12px,4vw,48px) 0;
  position:relative;
  overflow:hidden;
}
.site-header::after{
  content:"";
  position:absolute; inset:0;
  background: radial-gradient(circle at 88% -10%, rgba(226,62,156,0.35), transparent 55%);
  pointer-events:none;
}
.header-row{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
  position:relative; z-index:1;
}
.mic-mark{ flex:none; }
.mic-mark svg{ width:44px; height:44px; display:block; }
.brand-text{ flex:1; min-width:0; }
.brand-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size: clamp(20px, 3.4vw, 30px);
  letter-spacing:0.01em;
  margin:0; line-height:1.05;
}
.brand-logo{ display:block; height:84px; width:auto; max-width:100%; }
.brand-text .brand-sub{ margin-top:6px; }
@media (max-width:640px){ .brand-logo{ height:62px; } }
.brand-sub{
  margin:2px 0 0;
  font-size:13px;
  color:rgba(255,255,255,0.65);
  font-weight:500;
}
.header-badges{
  display:flex; align-items:center; gap:14px; flex:none; flex-wrap:wrap;
}
.badge-energia{
  font-size:11px; color:rgba(255,255,255,0.55);
  text-align:right; line-height:1.3;
}
.badge-energia strong{
  display:block; color:var(--energia-red); font-weight:800; font-size:15px; letter-spacing:0.01em;
}

.badge-sponsors{ display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
.badge-stash{
  display:flex; flex-direction:column; align-items:flex-end; gap:3px;
  font-size:11px; color:rgba(255,255,255,0.55); line-height:1.2;
  text-decoration:none;
}
.badge-stash img{ height:19px; width:auto; display:block; }
.badge-stash:hover img{ opacity:.88; }
.badge-ail{
  border:1.5px solid rgba(255,255,255,0.35);
  border-radius:3px;
  padding:5px 9px;
  font-family:var(--font-display);
  font-size:12px; font-weight:600; letter-spacing:0.06em;
  color:rgba(255,255,255,0.85);
  white-space:nowrap;
}
.spotify-link{
  display:inline-flex; align-items:center; gap:7px;
  background:#1ED760; color:#0B1F0E;
  border-radius:20px; padding:8px 14px 8px 10px;
  font-size:12.5px; font-weight:700;
  text-decoration:none; white-space:nowrap;
  transition: background 120ms ease, transform 120ms ease;
}
.spotify-link:hover{ background:#3EE778; transform:translateY(-1px); }
.spotify-link svg{ width:16px; height:16px; flex:none; }
.ace-group{ display:flex; flex-direction:column; align-items:center; gap:5px; }
.ace-sponsor-mini{
  display:inline-flex; align-items:center; gap:6px;
  font-size:10.5px; color:rgba(255,255,255,0.6); text-decoration:none; white-space:nowrap;
}
.ace-sponsor-mini img{ height:15px; width:auto; display:block; }
.ace-sponsor-mini:hover img{ opacity:.88; }
.ace-link{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--magenta); color:var(--white);
  border-radius:20px; padding:8px 14px;
  font-size:12.5px; font-weight:700;
  text-decoration:none; white-space:nowrap;
  transition: background 120ms ease, transform 120ms ease;
}
.ace-link:hover{ background:var(--magenta-deep); transform:translateY(-1px); }
.ace-link svg{ width:15px; height:15px; flex:none; }
.anyscor-logo{ display:inline-block; line-height:0; border-radius:6px; overflow:hidden; transition:transform 120ms ease, opacity 120ms ease; }
.anyscor-logo img{ height:34px; width:auto; display:block; }
.anyscor-logo:hover{ transform:translateY(-1px); opacity:.92; }
.anyscor-link{
  display:inline-flex; align-items:center; gap:7px;
  background:#1B7A5A; color:var(--white);
  border-radius:20px; padding:8px 14px;
  font-size:12.5px; font-weight:700;
  text-decoration:none; white-space:nowrap;
  transition: background 120ms ease, transform 120ms ease;
}
.anyscor-link:hover{ background:#155F46; transform:translateY(-1px); }
.anyscor-link svg{ width:15px; height:15px; flex:none; }

.season-strip{
  max-width:1180px; margin:18px auto 0;
  border-top:1px solid var(--purple-line);
  padding:14px 0;
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; gap:10px 28px;
  font-size:13px; color:rgba(255,255,255,0.72);
}
.season-strip b{color:var(--white); font-weight:600;}

/* ---------- Tabs ---------- */
.tab-nav{ margin-top:14px;
  max-width:1180px; margin:0 auto;
  padding: 16px 0 0;
  display:flex; gap:6px; flex-wrap:wrap;
  position:relative; z-index:1;
}
.tab-btn{
  appearance:none; border:none; cursor:pointer;
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.75);
  font-family:var(--font-display);
  font-size:14px; font-weight:500; letter-spacing:0.02em;
  padding:10px 18px 12px;
  border-radius:6px 6px 0 0;
  transition: background 120ms ease, color 120ms ease;
}
.tab-btn:hover{ background:rgba(255,255,255,0.14); color:var(--white); }
.tab-btn[aria-selected="true"]{
  background:var(--paper); color:var(--purple-deep); font-weight:600;
}

/* ---------- Weather strip ---------- */
.weather-strip{
  max-width:1180px; margin:12px auto 0;
  padding: 0 clamp(12px,4vw,48px) 16px;
  display:flex; flex-wrap:wrap; gap:8px;
  position:relative; z-index:1;
}
.weather-chip{
  display:inline-flex; align-items:center; gap:7px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:6px 12px;
  font-size:12.5px; color:rgba(255,255,255,0.85);
}
.weather-chip .wc-icon{ font-size:15px; line-height:1; }
.weather-chip .wc-city{ font-weight:600; color:var(--white); }
.weather-chip .wc-temp{ color:rgba(255,255,255,0.7); }
.weather-chip.wc-error{ color:rgba(255,255,255,0.45); }

/* ---------- Main layout ---------- */
main{
  max-width:1180px; margin:0 auto;
  padding: 28px clamp(12px,4vw,48px) 64px;
}
.division-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.division-head h2{
  font-family:var(--font-display); font-weight:600;
  font-size:26px; margin:0; color:var(--purple-deep);
}
.division-meta{
  font-size:13px; color:var(--ink-soft);
}

.panel-grid{
  display:grid;
  grid-template-columns: minmax(0,1.15fr) minmax(0,1fr);
  gap: 28px;
  align-items:start;
}
.performers-wrap{ margin-top:24px; }
@media (max-width: 860px){
  .panel-grid{ grid-template-columns: 1fr; }
}

.panel{
  background:var(--white);
  border:1px solid var(--paper-line);
  border-radius: var(--radius-card);
  min-width:0; /* grid/flex items default to min-width:auto, which lets a wide
                  table inside force this panel wider than its column instead
                  of shrinking — this is what makes .table-scroll's own
                  overflow-x:auto actually able to kick in below. */
}
.panel-title{
  font-family:var(--font-display); font-weight:600; font-size:13px;
  letter-spacing:0.08em; text-transform:uppercase;
  color:var(--white); background:var(--purple-deep);
  padding:10px 16px;
  border-radius: var(--radius-card) var(--radius-card) 0 0;
}


/* ---------- Ace of Clubs sponsor ---------- */
.ace-sponsor{
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px 14px;
  margin:0 0 20px; padding:12px 16px;
  background:var(--white); border:1px solid var(--paper-line); border-radius:var(--radius-card);
}
.ace-sponsor-label{ font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); }
.ace-sponsor a{ display:inline-block; line-height:0; }
.ace-sponsor img{ height:38px; width:auto; max-width:100%; display:block; }
.ace-sponsor a:hover img{ opacity:.88; }
@media (max-width:640px){ .ace-sponsor img{ height:32px; } }

/* ---------- Standings table ---------- */
.standings-empty{
  padding:14px 16px; font-size:13px; color:var(--ink-soft);
  border-bottom:1px solid var(--paper-line);
  background: #F6EEF7;
}
.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.scroll-hint{
  display:none;
  font-size:11px; color:var(--ink-soft);
  padding:6px 16px 0;
}
@media (max-width:640px){
  .scroll-hint{ display:block; }
  /* Once header-badges drops below the logo row, it needs to actually claim
     the full row width — otherwise its own flex-wrap:wrap has nothing to
     wrap against and the three pills just overflow past the screen edge. */
  .header-badges{ width:100%; }
}
table.standings{
  width:100%; border-collapse:collapse; font-size:12.5px;
  min-width:520px;
}
table.standings td.pd-cell.pd-pos{ color:#1a7a4a; font-weight:600; }
table.standings td.pd-cell.pd-neg{ color:#c0392b; font-weight:600; }
table.standings th, table.standings td{
  padding:9px 5px; text-align:center; border-bottom:1px solid var(--paper-line);
}
table.standings th{
  font-family:var(--font-body); font-weight:700; font-size:10.5px;
  color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;
  border-bottom:2px solid var(--paper-line);
}
table.standings td.team-cell, table.standings th.team-cell{ text-align:left; }
table.standings td.pos{ color:var(--ink-soft); font-weight:600; width:28px; }
table.standings td.team-name{
  font-weight:600; cursor:pointer; text-decoration:none;
  color:var(--ink);
}
table.standings td.team-name:hover{ color:var(--magenta-deep); text-decoration:underline; }
table.standings tr:last-child td{ border-bottom:none; }
table.standings td.pts{ font-weight:700; color:var(--purple-deep); }
table.standings tbody tr:hover{ background:#FBF3FA; }

/* ---------- Last-3 result chips (shared: table + drawer) ---------- */
.result-chip{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:4px;
  font-family:var(--font-display); font-weight:600; font-size:12px;
  color:var(--white); line-height:1;
}
.result-chip.w{ background:var(--win); }
.result-chip.d{ background:var(--draw); }
.result-chip.l{ background:var(--loss); }
.result-chip.tbd{
  background:transparent; border:1.5px dashed var(--paper-line); color:var(--paper-line);
}
td.last3-cell{ white-space:nowrap; }
.last3-row{ display:inline-flex; gap:4px; }

.scoring-key{
  padding:10px 16px; border-bottom:1px solid var(--paper-line);
  background:#FBF8FD;
  font-size:11.5px; color:var(--ink-soft);
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
}
.scoring-key .key-item{ display:flex; align-items:center; gap:5px; white-space:nowrap; }
.scoring-key .result-chip{ width:19px; height:19px; font-size:11px; border-radius:3px; }

.drawer-last3-row{ display:flex; gap:8px; margin-bottom:6px; }
.drawer-last3-detail{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; padding:7px 0; border-bottom:1px solid var(--paper-line); font-size:12.5px;
}
.drawer-last3-detail:last-child{ border-bottom:none; }
.drawer-last3-detail .dl-opponent{ flex:1; color:var(--ink-soft); }
.drawer-last3-detail .dl-score{ font-weight:600; }

/* ---------- Top performers ---------- */
.performers-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:0;
}
@media (max-width:640px){
  .performers-grid{ grid-template-columns:1fr; }
  .fixture-row{ padding-left:20px; font-size:13px; gap:6px; }
  .division-head{ margin-bottom:14px; }
  .division-head h2{ font-size:21px; }
  .panel-title{ font-size:12px; padding:9px 13px; }
  .panel-grid{ gap:16px; }
  .performers-wrap{ margin-top:16px; }
  main{ padding-top:20px; padding-bottom:44px; }
  .season-strip{ gap:8px 18px; }
}
.performers-col + .performers-col{ border-left:1px solid var(--paper-line); }
@media (max-width:640px){
  .performers-col + .performers-col{ border-left:none; border-top:1px solid var(--paper-line); }
}
.performers-col-title{
  font-family:var(--font-display); font-weight:600; font-size:12px;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--purple-deep);
  padding:12px 16px 6px;
}
.performer-row{
  display:flex; align-items:baseline; gap:10px;
  padding:7px 16px; font-size:13.5px;
}
.performer-row .pf-rank{ flex:none; width:26px; color:var(--ink-soft); font-weight:600; font-size:12px; }
.performer-row .pf-name{ flex:1; font-weight:600; }
.performer-row .pf-club{ flex:none; color:var(--ink-soft); font-size:12px; max-width:120px; text-align:right;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.performer-row .pf-tally{ flex:none; width:28px; text-align:right; font-weight:700; color:var(--magenta-deep); }
.performers-empty{ padding:12px 16px 16px; font-size:13px; color:var(--ink-soft); }

/* ---------- Ace of Clubs leaderboard tab ---------- */
.ace-search-wrap{ padding:12px 16px; border-bottom:1px solid var(--paper-line); }
.ace-search{
  width:100%; box-sizing:border-box; padding:9px 12px; font-size:14px;
  border:1px solid var(--paper-line); border-radius:8px; font-family:inherit;
  color:var(--ink); background:var(--paper);
}
.ace-search:focus{ outline:2px solid var(--magenta); outline-offset:-1px; }
.ace-table{ font-size:13.5px; }
.ace-row{
  display:grid; grid-template-columns: 44px 1.6fr 1fr 1.3fr 60px 60px;
  gap:8px; align-items:center; padding:9px 16px;
  border-bottom:1px solid var(--paper-line);
}
.ace-row:last-child{ border-bottom:none; }
.ace-row.ace-head{
  font-size:11px; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--ink-soft); font-weight:700; background:var(--paper);
  position:sticky; top:0;
}
.ace-rows .ace-row:hover{ background:#FBF3FA; }
.ace-rank{ color:var(--ink-soft); font-weight:600; }
.ace-name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.host-badge{
  display:inline-block; margin-left:8px; padding:2px 7px; border-radius:10px;
  background:var(--magenta); color:#fff; font-size:9.5px; font-weight:800;
  letter-spacing:0.06em; vertical-align:middle;
}
.ace-row.ace-host{ background:#FBF3FA; }
.ace-handle, .ace-club{ color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ace-correct{ text-align:right; }
.ace-points{ text-align:right; font-weight:700; color:var(--magenta-deep); }
.ace-no-match{ padding:20px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px; }
.ace-rows{ max-height:520px; overflow-y:auto; }
@media (max-width:640px){
  .ace-row{ grid-template-columns: 38px 1.4fr 0.9fr 60px 50px; gap:6px; padding:8px 12px; font-size:12.5px; }
  .ace-club{ display:none; }
}

/* ---------- Fixtures list ---------- */
.fixtures-body{ padding: 4px 0 8px; }
.kickoff-note{
  margin:0; padding:10px 16px; font-size:12px; color:var(--ink-soft);
  background:#FBF8FD; border-bottom:1px solid var(--paper-line);
}
details.round-group{
  border-bottom:1px solid var(--paper-line);
}
details.round-group:last-child{ border-bottom:none; }
details.round-group summary{
  list-style:none; cursor:pointer;
  padding:11px 16px;
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-display); font-weight:500; font-size:14px;
  color:var(--purple-deep);
}
details.round-group summary::-webkit-details-marker{ display:none; }
details.round-group summary .chev{
  transition: transform 140ms ease;
  font-size:11px; color:var(--ink-soft);
}
details.round-group[open] summary .chev{ transform:rotate(90deg); }
details.round-group summary .round-date{
  font-family:var(--font-body); font-weight:500; font-size:12px; color:var(--ink-soft);
  margin-left:auto;
}
.fixture-row{
  display:flex; align-items:center; gap:10px;
  padding:8px 16px 8px 40px;
  font-size:13.5px;
}
.fixture-row .fx-team{ cursor:pointer; }
.fixture-row .fx-team:hover{ color:var(--magenta-deep); text-decoration:underline; }
.fixture-row .fx-home{ flex:1; text-align:right; }
.fixture-row .fx-away{ flex:1; text-align:left; }
.fixture-row .fx-vs{
  flex:none; font-family:var(--font-display); font-size:11px; color:var(--ink-soft);
  background:var(--paper); border:1px solid var(--paper-line);
  border-radius:3px; padding:2px 7px;
}
.fixture-row .fx-when{
  flex:none; font-size:11px; color:var(--ink-soft); width:56px; text-align:right;
}
.fixture-row .fx-when.rescheduled{
  color:var(--magenta-deep); font-weight:600; width:auto;
}
.fixture-row .fx-when.fx-final{
  color:var(--purple-deep); font-weight:700; width:auto; font-family:var(--font-display);
}
.fixture-row .fx-team.fx-winner{ font-weight:700; color:var(--ink); }

/* ---------- Drawer ---------- */
.drawer-backdrop{
  position:fixed; inset:0; background:rgba(23,11,46,0.55);
  opacity:0; pointer-events:none; transition:opacity 160ms ease;
  z-index:40;
}
.drawer-backdrop.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; height:100%;
  width:min(420px, 92vw);
  background:var(--white);
  box-shadow:-12px 0 32px rgba(23,11,46,0.25);
  transform:translateX(100%);
  transition:transform 200ms ease;
  z-index:41;
  display:flex; flex-direction:column;
}
.drawer.open{ transform:translateX(0); }
.drawer-head{
  background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid));
  color:var(--white);
  padding:22px 20px;
  position:relative;
}
.drawer-head .drawer-division{
  font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.65);
}
.drawer-head h3{
  font-family:var(--font-display); font-weight:600; font-size:24px; margin:4px 0 0;
}
.drawer-close{
  position:absolute; top:16px; right:16px;
  background:rgba(255,255,255,0.14); border:none; color:var(--white);
  width:30px; height:30px; border-radius:50%; cursor:pointer;
  font-size:16px; line-height:1;
}
.drawer-close:hover{ background:rgba(255,255,255,0.26); }
.drawer-body{ padding:20px; overflow-y:auto; flex:1; }
.drawer-section-title{
  font-family:var(--font-display); font-weight:600; font-size:12px;
  text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft);
  margin:0 0 10px;
}
.form-chips{ display:flex; gap:8px; margin-bottom:22px; }
.form-chip{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--white);
}
.form-chip.w{ background:var(--win); }
.form-chip.d{ background:var(--draw); }
.form-chip.l{ background:var(--loss); }
.empty-note{
  font-size:13px; color:var(--ink-soft); background:var(--paper);
  border:1px dashed var(--paper-line); border-radius:4px; padding:12px 14px;
  margin-bottom:22px;
}
.next-fixture{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--paper-line); font-size:13.5px;
}
.next-fixture:last-child{ border-bottom:none; }
.next-fixture .nf-date{ font-size:11.5px; color:var(--ink-soft); width:74px; flex:none; }

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-IE', { day:'numeric', month:'short' });
}

function fixturesForTeam(divKey, team){
  return DATA[divKey].fixtures
    .filter(f => f.home === team || f.away === team)
    .sort((a,b) => a.round - b.round);
}

// AIL bonus-point scoring: Win=4, Draw=2, Loss=0, +1 for 4+ tries, +1 for losing by <=7.
// Colour always follows the underlying result (W/D/L) — e.g. a 2-point loss (both
// bonus points) still shows red, and a plain 2-point draw still shows orange, even
// though the number is the same.
function computeResult(fixture, team){
  if(!fixture.played) return null;
  const isHome = fixture.home === team;
  const teamScore = isHome ? fixture.homeScore : fixture.awayScore;
  const oppScore  = isHome ? fixture.awayScore : fixture.homeScore;
  const teamTries = isHome ? fixture.homeTries : fixture.awayTries;
  const opponent  = isHome ? fixture.away : fixture.home;

  let outcome = teamScore > oppScore ? 'w' : (teamScore === oppScore ? 'd' : 'l');
  const tryBonus = (teamTries !== null && teamTries !== undefined) ? teamTries >= 4 : false;
  const losingBonus = outcome === 'l' && (oppScore - teamScore) <= 7;

  const base = outcome === 'w' ? 4 : (outcome === 'd' ? 2 : 0);
  const points = base + (tryBonus ? 1 : 0) + (losingBonus ? 1 : 0);

  return { outcome, points, tryBonus, losingBonus, opponent, teamScore, oppScore, round: fixture.round, isHome };
}

function lastNResults(divKey, team, n){
  const played = fixturesForTeam(divKey, team)
    .map(f => computeResult(f, team))
    .filter(r => r !== null);
  return played.slice(-n); // chronological order, most recent last
}

function renderChip(result){
  if(!result) return `<span class="result-chip tbd" title="Not yet played">&middot;</span>`;
  const detail = `${result.outcome.toUpperCase()} vs ${result.opponent} (R${result.round})` +
    (result.tryBonus ? ' +TBP' : '') + (result.losingBonus ? ' +LBP' : '');
  return `<span class="result-chip ${result.outcome}" title="${detail}">${result.points}</span>`;
}

function renderScoringKey(){
  return `
    <div class="scoring-key">
      <span class="key-item"><span class="result-chip w">5</span> Win + try BP</span>
      <span class="key-item"><span class="result-chip w">4</span> Win</span>
      <span class="key-item"><span class="result-chip d">3</span> Draw + try BP</span>
      <span class="key-item"><span class="result-chip d">2</span> Draw</span>
      <span class="key-item"><span class="result-chip l">2</span> Loss + 2 BP</span>
      <span class="key-item"><span class="result-chip l">1</span> Loss + 1 BP</span>

    </div>`;
}

function renderStandingsTable(divKey){
  const div = DATA[divKey];
  const seasonStarted = div.standings.some(r => r.p > 0);
  // Alphabetical until there's something to actually rank; once real results
  // exist, sort by points, then points difference, then points-for (standard
  // AIL tie-break order) — sorting was previously always alphabetical here,
  // which meant the table never actually reflected the standings once games
  // were played.
  const rows = [...div.standings].sort((a, b) => {
    if (!seasonStarted) return a.team.localeCompare(b.team);
    if (b.pts !== a.pts) return b.pts - a.pts;
    const pdA = a.pf - a.pa, pdB = b.pf - b.pa;
    if (pdB !== pdA) return pdB - pdA;
    return b.pf - a.pf;
  });
  const emptyNote = seasonStarted ? '' :
    `<div class="standings-empty">Season not yet underway — table shown alphabetically until Round 1 results are in.</div>`;
  const body = rows.map((r, i) => {
    const last3 = lastNResults(divKey, r.team, 3);
    const chips = [0,1,2].map(slot => {
      const missing = 3 - last3.length;
      return slot < missing ? renderChip(null) : renderChip(last3[slot - missing]);
    }).join('');
    const pd = r.pf - r.pa;
    const pdLabel = pd > 0 ? `+${pd}` : `${pd}`;
    const pdClass = pd > 0 ? 'pd-pos' : (pd < 0 ? 'pd-neg' : '');
    return `
    <tr>
      <td class="pos">${seasonStarted ? (i+1) : '—'}</td>
      <td class="team-cell team-name" data-team="${r.team}" data-division="${divKey}" tabindex="0">${r.team}</td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
      <td>${r.pf}</td><td>${r.pa}</td>
      <td class="pd-cell ${pdClass}">${pdLabel}</td>
      <td class="pts">${r.pts}</td>
      <td class="last3-cell"><span class="last3-row">${chips}</span></td>
    </tr>`;
  }).join('');
  return `
    <div class="panel">
      <div class="panel-title">League Table</div>
      ${renderScoringKey()}
      ${emptyNote}
      <p class="scroll-hint">Swipe to see the full table &rarr;</p>
      <div class="table-scroll">
        <table class="standings">
          <thead><tr>
            <th></th><th class="team-cell">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>PA</th><th>PD</th><th>Pts</th><th>Last 3</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

function renderFixturesPanel(divKey){
  const div = DATA[divKey];
  const rounds = {};
  div.fixtures.forEach(f => { (rounds[f.round] = rounds[f.round] || []).push(f); });
  const roundNums = Object.keys(rounds).map(Number).sort((a,b) => a-b);
  const totalRounds = Math.max(...roundNums);
  const groups = roundNums.map((rn, idx) => {
    const games = rounds[rn];
    // Most fixtures in a round share one date, but (confirmed against real
    // fixture data) an individual match can genuinely move to a different day
    // — so the round header shows the primary date, and each row carries its
    // own actual date + time rather than assuming the round's date for all.
    const dateCounts = {};
    games.forEach(f => { dateCounts[f.date] = (dateCounts[f.date] || 0) + 1; });
    const primaryDate = Object.keys(dateCounts).sort((a,b) => dateCounts[b]-dateCounts[a])[0];
    const anyOffStandard = games.some(f => f.date !== primaryDate || f.time !== div.kickoff.time);
    const dateLabel = fmtDate(primaryDate) + (anyOffStandard ? ' *' : '');
    const rows = games.map(f => {
      let fxWhen;
      if (f.played) {
        fxWhen = `<span class="fx-when fx-final" title="Full time">${f.homeScore}&ndash;${f.awayScore}</span>`;
      } else {
        const offStandard = f.date !== primaryDate || f.time !== div.kickoff.time;
        fxWhen = offStandard
          ? `<span class="fx-when rescheduled">${f.date !== primaryDate ? fmtDate(f.date) + ' &middot; ' : ''}${f.time} *</span>`
          : `<span class="fx-when">${f.time}</span>`;
      }
      const homeWon = f.played && f.homeScore > f.awayScore;
      const awayWon = f.played && f.awayScore > f.homeScore;
      return `
      <div class="fixture-row">
        <span class="fx-team fx-home ${homeWon ? 'fx-winner' : ''}" data-team="${f.home}" data-division="${divKey}" tabindex="0">${f.home}</span>
        <span class="fx-vs">v</span>
        <span class="fx-team fx-away ${awayWon ? 'fx-winner' : ''}" data-team="${f.away}" data-division="${divKey}" tabindex="0">${f.away}</span>
        ${fxWhen}
      </div>`;
    }).join('');
    return `
      <details class="round-group" ${idx===0 ? 'open' : ''}>
        <summary><span class="chev">&#9656;</span> Round ${rn} <span class="round-date">${dateLabel}</span></summary>
        ${rows}
      </details>`;
  }).join('');
  return `
    <div class="panel">
      <div class="panel-title">Fixtures — All ${totalRounds} Rounds</div>
      <p class="kickoff-note">Standard kick-off is ${div.kickoff.day}s at ${div.kickoff.time}. Fixtures marked * kick off on a different day or time — always double-check nearer the date for anything not marked.</p>
      <div class="fixtures-body">${groups}</div>
    </div>`;
}

function renderPerformersPanel(divKey){
  const scorers = DATA[divKey].scorers || { tries: [], points: [] };
  const bothEmpty = scorers.tries.length === 0 && scorers.points.length === 0;

  function renderCol(list, tallyKey, label){
    if(list.length === 0){
      return `<div class="performers-col">
        <div class="performers-col-title">${label}</div>
        <div class="performers-empty">No match reports in yet — top ${label.toLowerCase()} will appear here once they do.</div>
      </div>`;
    }
    // Ties share a rank and are marked "T" (e.g. T2). Ranks are worked out
    // against the full list, so a player tied at 2nd is T2 whether or not
    // everyone they're tied with fits in the top 8. Ties are ordered A–Z so
    // the order is consistent.
    const full = [...list].sort((a,b) => (b[tallyKey] - a[tallyKey]) || a.player.localeCompare(b.player));
    const rankOf = p => 1 + full.filter(q => q[tallyKey] > p[tallyKey]).length;
    const isTied = p => full.filter(q => q[tallyKey] === p[tallyKey]).length > 1;
    // Top 8, plus anyone tied on the same tally as 8th place so nobody is
    // left out of a tie at the cut-off.
    const cutoff = full.length > 8 ? full[7][tallyKey] : null;
    const sorted = cutoff === null ? full : full.filter(p => p[tallyKey] >= cutoff);
    const rows = sorted.map((p, i) => `
      <div class="performer-row">
        <span class="pf-rank">${isTied(p) ? 'T' : ''}${rankOf(p)}</span>
        <span class="pf-name">${p.player}</span>
        <span class="pf-club">${p.club}</span>
        <span class="pf-tally">${p[tallyKey]}</span>
      </div>`).join('');
    return `<div class="performers-col">
      <div class="performers-col-title">${label}</div>
      ${rows}
    </div>`;
  }

  return `
    <div class="panel">
      <div class="panel-title">Top Performers</div>
      <div class="performers-grid">
        ${renderCol(scorers.tries, 'tries', 'Top Try Scorers')}
        ${renderCol(scorers.points, 'points', 'Top Points Scorers')}
      </div>
    </div>`;
}

// Ties: players on the same points total share a rank and are marked "T"
// (e.g. T3). Computed per table, from the rows as given, so overall / monthly /
// weekly each get their own correct tie markers.
function withTieRanks(rows){
  const counts = new Map();
  rows.forEach(r => counts.set(r.points, (counts.get(r.points) || 0) + 1));
  let higher = 0, lastPoints = null, lastRank = 0;
  const sorted = [...rows].sort((a, b) => b.points - a.points);
  const rankByPoints = new Map();
  sorted.forEach(r => {
    if (r.points !== lastPoints) { lastRank = higher + 1; lastPoints = r.points; rankByPoints.set(r.points, lastRank); }
    higher++;
  });
  return rows.map(r => ({ ...r, rankLabel: (counts.get(r.points) > 1 ? 'T' : '') + rankByPoints.get(r.points) }));
}

function aceTableHTML(idPrefix, rows){
  rows = withTieRanks(rows);
  return `

// Merges every month currently in ACE_DATA.months into one combined
// leaderboard (summing correct picks + points per player, re-ranked) rather
// than showing only the latest month on its own. Round 1 landed right at the
// tail end of September, so a September-only table would barely mean
// anything — this combines it with October as one period, and keeps working
// automatically if more months get added later (label adjusts to whichever
// months are actually present).
function combineMonths(months){
  if(!months || months.length === 0) return null;
  if(months.length === 1) return { label: months[0].label, rows: months[0].rows };
  const byPlayer = new Map();
  months.forEach(m => {
    m.rows.forEach(r => {
      // Match by pid (an opaque per-player id, never displayed) rather than
      // name — two different real people can share a name (e.g. two actual
      // "Frank Fitzgerald"s in this data, different clubs), and matching by
      // name alone would wrongly merge their separate scores together.
      const key = r.pid;
      if(!byPlayer.has(key)){
        byPlayer.set(key, { name: r.name, handle: r.handle, club: r.club, correct: 0, points: 0 });
      }
      const entry = byPlayer.get(key);
      entry.correct += (r.correct || 0);
      entry.points += (r.points || 0);
      if(!entry.handle && r.handle) entry.handle = r.handle;
      if(!entry.club && r.club) entry.club = r.club;
    });
  });
  const rows = Array.from(byPlayer.values())
    .sort((a, b) => b.points - a.points || b.correct - a.correct)
    .map((r, i) => ({ ...r, rank: i + 1 }));
  const labels = months.map(m => m.label);
  const label = labels.length > 1
    ? `${labels[0].split(' ')[0]} \u2013 ${labels[labels.length - 1]}`
    : labels[0];
  return { label, rows };
}

function attachAceFilterHandlers(){
  document.querySelectorAll('.ace-search').forEach(input => {
    input.addEventListener('input', () => {
      const prefix = input.id.replace('-search','');
      const q = input.value.trim().toLowerCase();
      const rowsWrap = document.getElementById(prefix + '-rows');
      const noMatch = document.getElementById(prefix + '-no-match');
      let visibleCount = 0;
      rowsWrap.querySelectorAll('.ace-row').forEach(row => {
        const match = !q || row.dataset.search.includes(q);
        row.style.display = match ? '' : 'none';
        if(match) visibleCount++;
      });
      noMatch.style.display = visibleCount === 0 ? '' : 'none';
    });
  });
}

function renderDivision(){
  if(activeDivision === 'ACE'){
    document.getElementById('mainContent').innerHTML = renderAceOfClubsTab();
    attachAceFilterHandlers();
    return;
  }
  const div = DATA[activeDivision];
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="division-head">
      <h2>${div.label}</h2>
      <div class="division-meta">${div.teams.length} clubs · double round-robin · ${Math.max(...div.fixtures.map(f=>f.round))} rounds · kick-off ${div.kickoff.day}s, ${div.kickoff.time}</div>
    </div>
    <div class="panel-grid">
      ${renderStandingsTable(activeDivision)}
      ${renderFixturesPanel(activeDivision)}
    </div>
    <div class="performers-wrap">
      ${renderPerformersPanel(activeDivision)}
    </div>`;
  attachTeamHandlers();
}

function attachTeamHandlers(){
  document.querySelectorAll('[data-team]').forEach(el => {
    el.addEventListener('click', () => openDrawer(el.dataset.division, el.dataset.team));
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDrawer(el.dataset.division, el.dataset.team); }
    });
  });
}

function openDrawer(divKey, team){
  const div = DATA[divKey];
  document.getElementById('drawerDivision').textContent = div.label;
  document.getElementById('drawerTeamName').textContent = team;

  const last3 = lastNResults(divKey, team, 3);
  const formEl = document.getElementById('drawerForm');
  if(last3.length === 0){
    formEl.innerHTML = `<p class="empty-note">No results yet — ${team}'s form will appear here once the season is under way.</p>`;
  } else {
    const chipsRow = `<div class="drawer-last3-row">${last3.map(renderChip).join('')}</div>`;
    const rows = last3.slice().reverse().map(r => `
      <div class="drawer-last3-detail">
        <span class="dl-opponent">${r.isHome ? 'vs' : '@'} ${r.opponent} · R${r.round}</span>
        <span class="dl-score">${r.teamScore}-${r.oppScore}</span>
      </div>`).join('');
    formEl.innerHTML = chipsRow + rows;
  }

  const upcoming = fixturesForTeam(divKey, team).filter(f => !f.played).slice(0,3);
  const nextEl = document.getElementById('drawerNext');
  nextEl.innerHTML = upcoming.map(f => {
    const opponent = f.home === team ? f.away : f.home;
    const venue = f.home === team ? 'H' : 'A';
    return `
      <div class="next-fixture">
        <span class="nf-date">${fmtDate(f.date)}</span>
        <span class="nf-match">${venue === 'H' ? 'vs' : '@'} ${opponent}</span>
        <span class="nf-round">R${f.round}</span>
      </div>`;
  }).join('') || `<p class="empty-note">No fixtures found.</p>`;

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden','false');
  document.getElementById('drawerBackdrop').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('drawerBackdrop').classList.remove('open');
}

document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDrawer(); });

// ---- Matchday weather: Dublin, Cork, Galway, Limerick ----
// Fetched client-side (Open-Meteo, no API key needed) when a visitor loads
// the page — this is their browser making the request, not ours, so it works
// the same whether the site is opened locally or hosted live.
const WEATHER_CITIES = [
  { name: "Dublin",   lat: 53.3498, lon: -6.2603 },
  { name: "Cork",     lat: 51.8985, lon: -8.4756 },
  { name: "Galway",   lat: 53.2707, lon: -9.0568 },
  { name: "Limerick", lat: 52.6638, lon: -8.6267 },
  { name: "Belfast",  lat: 54.5973, lon: -5.9301 }
];

// WMO weather codes (used by Open-Meteo) collapsed into a simple icon + label.
function weatherIcon(code){
  if(code === 0) return ["\u2600\ufe0f", "Clear"];
  if([1,2].includes(code)) return ["\ud83c\udf24\ufe0f", "Partly cloudy"];
  if(code === 3) return ["\u2601\ufe0f", "Cloudy"];
  if([45,48].includes(code)) return ["\ud83c\udf2b\ufe0f", "Fog"];
  if([51,53,55,56,57].includes(code)) return ["\ud83c\udf26\ufe0f", "Drizzle"];
  if([61,63,65,66,67,80,81,82].includes(code)) return ["\ud83c\udf27\ufe0f", "Rain"];
  if([71,73,75,77,85,86].includes(code)) return ["\u2744\ufe0f", "Snow"];
  if([95,96,99].includes(code)) return ["\u26c8\ufe0f", "Storms"];
  return ["\ud83c\udf24\ufe0f", "—"];
}

function renderWeatherChip(city, data){
  if(!data){
    return `<span class="weather-chip wc-error"><span class="wc-city">${city}</span><span class="wc-temp">weather unavailable</span></span>`;
  }
  const [icon, label] = weatherIcon(data.weathercode);
  const temp = Math.round(data.temperature);
  return `<span class="weather-chip" title="${label}">
    <span class="wc-icon">${icon}</span>
    <span class="wc-city">${city}</span>
    <span class="wc-temp">${temp}\u00b0C</span>
  </span>`;
}

async function fetchCityWeather(city){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response');
    const json = await res.json();
    return json.current_weather;
  } catch(err){
    return null;
  }
}

async function initWeather(){
  const strip = document.getElementById('weatherStrip');
  // placeholder while loading
  strip.innerHTML = WEATHER_CITIES.map(c =>
    `<span class="weather-chip"><span class="wc-city">${c.name}</span><span class="wc-temp">…</span></span>`
  ).join('');
  const results = await Promise.all(WEATHER_CITIES.map(fetchCityWeather));
  strip.innerHTML = WEATHER_CITIES.map((c, i) => renderWeatherChip(c.name, results[i])).join('');
}

buildTabs();
renderDivision();
initWeather();
</script>
